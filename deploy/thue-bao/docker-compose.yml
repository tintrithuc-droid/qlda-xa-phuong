# Máy chủ cho thuê nhiều xã/phường (bản 1.6): một PostgreSQL, một bộ phần mềm, một cổng vào HTTPS cho mọi xã.
# Mỗi xã một CSDL + một tài khoản CSDL riêng, một thư mục tệp riêng. Cài bằng cai-dat.sh (xem HUONG_DAN_MAY_CHU_THUE_BAO.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qlda_nentang
      POSTGRES_USER: qlda_quantri
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Chưa đặt PG_PASSWORD trong tệp .env}
      TZ: Asia/Ho_Chi_Minh
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-400}", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-1GB}", "-c", "work_mem=8MB"]
    volumes:
      - ./postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qlda_quantri -d qlda_nentang"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    image: ${QLDA_IMAGE:-qlda-xa-phuong:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      Tenancy__Enabled: "true"
      Tenancy__BaseDomain: ${BASE_DOMAIN:?Chưa đặt BASE_DOMAIN trong tệp .env}
      Tenancy__DataRoot: /app/App_Data/xa
      Storage__KeysPath: /app/App_Data/keys
      ConnectionStrings__PostgreSQL: "Host=db;Database=qlda_nentang;Username=qlda_quantri;Password=${PG_PASSWORD}"
      ReverseProxy__Enabled: "true"
      Backup__Hour: ${APP_BACKUP_HOUR:-1}
      Backup__Keep: ${APP_BACKUP_KEEP:-7}
    volumes:
      - ./du-lieu:/app/App_Data:Z
    # Không mở cổng ra ngoài: chỉ cổng vào Caddy truy cập được phần mềm

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./caddy:/data:Z
